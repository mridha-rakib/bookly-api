# Drop-in for the API service unit (/etc/systemd/system/<api>.service.d/first-class.conf).
# The API pins the release at startup, so it starts after a renewal attempt. Wants (not
# Requires): non-First-Class features keep running when the authority is unavailable, and
# First-Class gates stay closed until the next restart after a successful adoption.
[Unit]
Wants=bookly-first-class-authority-renew.service
After=bookly-first-class-authority-renew.service chrony.service
